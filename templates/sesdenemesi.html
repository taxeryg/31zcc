<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ses Denemesi — Live Stream Audio Transcription</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { background: #0c0d14; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; padding: 24px; }
    .container { max-width: 800px; margin: 0 auto; background: #131520; border: 1px solid #232738; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .header-box { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #232738; padding-bottom: 16px; }
    .title { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; background: #1a1d2d; border: 1px solid #2e344d; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; }
    .btn-act { background: #10b981; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-act:hover { background: #059669; }
    .status-bar { padding: 10px 14px; background: #1a1d2d; border-radius: 8px; font-size: 0.88rem; color: #94a3b8; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
    .status-dot.connected { background: #10b981; box-shadow: 0 0 10px #10b981; }
    .status-dot.connecting { background: #f59e0b; }
    .transcript-box { background: #0b0c12; border: 1px solid #1e2235; border-radius: 8px; height: 400px; overflow-y: auto; padding: 16px; }
    .transcript-item { padding: 10px 14px; background: #131625; border-left: 4px solid #3b82f6; border-radius: 6px; margin-bottom: 10px; animation: fadeIn 0.3s ease; }
    .item-header { font-size: 0.75rem; color: #64748b; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .item-text { font-size: 1rem; color: #f1f5f9; font-weight: 500; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="container">
  <div class="header-box">
    <div class="title">🎙️ Yayın Ses Denemesi</div>
    <a href="/" style="color:#3b82f6;text-decoration:none;font-size:0.9rem">← Ana Panele Dön</a>
  </div>

  <div class="input-group">
    <input type="text" id="channel-input" placeholder="Canlı yayındaki Kick kanal adı (ör: wtcn, elraenn)">
    <button class="btn-act" onclick="startListening()">🎧 Sesi Çek & Metne Çevir</button>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="dot"></div>
    <span id="status-text">Kanal adı girip 'Sesi Çek' butonuna basın</span>
  </div>

  <div class="transcript-box" id="transcripts">
    <div style="text-align:center;color:#64748b;padding:40px">
      Yayıncının konuştuğu sözler burada canlı metin olarak belirecek...
    </div>
  </div>
</div>

<script>
  const socket = io();
  const transcriptsEl = document.getElementById('transcripts');
  const dotEl = document.getElementById('dot');
  const statusTextEl = document.getElementById('status-text');

  socket.on('audio_status', data => {
    statusTextEl.textContent = data.message;
    if (data.status === 'connected') {
      dotEl.className = 'status-dot connected';
    } else if (data.status === 'connecting') {
      dotEl.className = 'status-dot connecting';
    } else {
      dotEl.className = 'status-dot';
    }
  });

  socket.on('audio_transcript', data => {
    if (transcriptsEl.children.length === 1 && transcriptsEl.children[0].textContent.includes('belirecek')) {
      transcriptsEl.innerHTML = '';
    }
    const item = document.createElement('div');
    item.className = 'transcript-item';
    item.innerHTML = `
      <div class="item-header">
        <span>🗣️ YAYINCI [${data.channel}]</span>
        <span>${data.timestamp}</span>
      </div>
      <div class="item-text">"${data.text}"</div>
    `;
    transcriptsEl.appendChild(item);
    transcriptsEl.scrollTop = transcriptsEl.scrollHeight;
  });

  async function startListening() {
    const ch = document.getElementById('channel-input').value.trim();
    if (!ch) return alert('Lütfen kanal adı girin');

    statusTextEl.textContent = `${ch} yayın sesi aranıyor...`;
    dotEl.className = 'status-dot connecting';

    const res = await fetch('/api/audio/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({channel: ch})
    });
    const data = await res.json();
    if (data.error) alert(data.error);
  }
</script>

</body>
</html>
